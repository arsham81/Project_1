name: Windows application checks
on:
  push:
    branches: [zcmc-plan-comparison]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate desktop installation and shortcut
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ZCMC Test Install'
          $desktop = Join-Path $env:RUNNER_TEMP 'Test Desktop'
          & .\install.ps1 -InstallRoot $root -DesktopRoot $desktop -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          $link = Join-Path $desktop 'ZCMC Plan Compare.lnk'
          if (-not (Test-Path $link)) { throw 'Desktop shortcut missing' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if (-not (Test-Path $shortcut.TargetPath)) { throw 'Shortcut target missing' }
          Push-Location $root
          & (Join-Path $root '.venv\Scripts\python.exe') -c 'import tkinter as tk; from desktop import App; r=tk.Tk(); a=App(r); r.update(); r.destroy()'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop window startup failed' }
          Pop-Location
